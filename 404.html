<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Страница не найдена</title>
    <link rel="stylesheet" href="/prints/build/css/styles.css">
</head>
<body>
    <main class="container gallery-document">
        <h1 id="page-title">Страница не найдена</h1>
        <a href="/prints/">Открыть Mukashov Gallery</a>
    </main>
    <script type="module">
        const slug = window.location.pathname.replace(/^\/|\/$/g, "").toLowerCase();
        if (/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(slug)) {
            const title = document.querySelector("#page-title");
            title.textContent = "Ищем профиль автора…";
            try {
                const { loadPublicArtistProfile } = await import("/prints/build/js/artist-data.js");
                if (await loadPublicArtistProfile({ profile_handle: slug })) {
                    window.location.replace(`/prints/?author=${encodeURIComponent(slug)}`);
                } else {
                    title.textContent = "Страница не найдена";
                }
            } catch {
                title.textContent = "Не удалось открыть страницу";
            }
        }
    </script>
</body>
</html>
