<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Карточка принта с выбором размера и дизайна багета.">
    <title>Принт — Mukashov Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="build/css/styles.css">
    <link rel="stylesheet" href="build/css/artists.css">
    <link rel="stylesheet" href="build/css/product.css">
    <script type="module" src="build/js/profile-menu.js"></script>
    <script defer src="build/js/language-link.js"></script>
</head>
<body data-prints-page="product">
    <div class="prints-page">
        <div class="announcement-bar">
            <div class="container announcement-bar__inner">
                <span>Доставка по всему миру</span>
            </div>
        </div>

        <header class="prints-header">
            <div class="container prints-header__inner">
                <nav class="prints-nav prints-nav--left" aria-label="Основная навигация">
                    <a href="./?category=abstract">Абстракция</a>
                    <a href="./?category=figurative">Фигуративное искусство</a>
                    <a href="./?category=landscape">Пейзаж</a>
                </nav>
                <a class="prints-brand" href="./">MUKASHOV GALLERY</a>
                <div class="prints-nav prints-nav--right">
                    <details class="profile-menu" data-profile-menu>
                        <summary aria-label="Профиль" title="Профиль">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="8" r="3.25"></circle>
                                <path d="M5 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"></path>
                            </svg>
                        </summary>
                        <div class="profile-menu__panel">
                            <div data-profile-guest>
                                <a href="./artists.html?mode=login">Войти</a>
                                <a href="./artists.html?mode=register">Зарегистрироваться</a>
                            </div>
                            <div data-profile-account hidden>
                                <a href="./artists.html#works">Мои работы</a>
                                <a href="./artists.html#new-work">Добавить работу</a>
                                <a href="./artists.html#profile">Настройки профиля</a>
                                <button type="button" data-profile-signout>Выйти</button>
                            </div>
                            <p class="profile-menu__notice" role="status" hidden></p>
                        </div>
                    </details>
                    <button class="nav-action" type="button" data-favourites-open aria-describedby="favourites-count" aria-label="Открыть избранное">
                        <span class="nav-action__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M12 21.35 10.55 20C5.4 15.36 2 12.27 2 8.5 2 5.41 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6.01 6.01 0 0 1 16.5 3C19.58 3 22 5.41 22 8.5c0 3.77-3.4 6.86-8.55 11.54L12 21.35Z"></path>
                            </svg>
                        </span>
                        <span class="nav-action__count" id="favourites-count" data-favourites-count></span>
                    </button>
                    <button class="nav-action" type="button" data-cart-open aria-describedby="cart-count" aria-label="Открыть корзину">
                        <span class="nav-action__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M7 7.5V6a5 5 0 0 1 10 0v1.5"></path>
                                <path d="M5 7.5h14l-1.2 13H6.2L5 7.5Z"></path>
                            </svg>
                        </span>
                        <span class="nav-action__count" id="cart-count" data-cart-count></span>
                    </button>
                </div>
            </div>
        </header>

        <main class="product-main">
            <div class="container">
                <a class="back-link" href="./">К каталогу</a>

                <section class="product-shell">
                    <div class="product-shell__media" id="productGallery"></div>
                    <aside class="product-shell__sidebar" id="productSummary"></aside>
                </section>
            </div>

            <section class="featured" id="authorWorks" aria-labelledby="authorWorksHeading" hidden>
                <div class="container">
                    <div class="section-head section-head--compact">
                        <h2 id="authorWorksHeading">Работы того же автора</h2>
                    </div>
                    <div class="prints-grid"></div>
                </div>
            </section>

            <section class="featured" id="relatedWorks" aria-labelledby="relatedWorksHeading" hidden>
                <div class="container">
                    <div class="section-head section-head--compact">
                        <h2 id="relatedWorksHeading">Похожие работы</h2>
                    </div>
                    <div class="prints-grid"></div>
                </div>
            </section>

            <section class="footer-links-bar" id="productFooterMenu"></section>
        </main>

        <footer class="prints-footer">
            <div class="container prints-footer__inner">
                <p>© 2026 Mukashov Gallery</p>
                <nav class="prints-footer__links" aria-label="Документы галереи">
                    <a href="./offer.html">Публичная оферта</a>
                    <span aria-hidden="true">·</span>
                    <a href="./privacy.html">Политика обработки персональных данных</a>
                    <span aria-hidden="true">·</span>
                    <a href="./en/product.html" hreflang="en" lang="en" data-gallery-language>English</a>
                </nav>
            </div>
        </footer>
    </div>

    <script src="build/js/data.js"></script>
    <script src="build/js/scripts.js"></script>
</body>
</html>
