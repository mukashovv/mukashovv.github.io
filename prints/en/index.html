<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Mukashov Gallery — a collection of framed prints with a choice of sizes and frames.">
    <title>Prints — Mukashov Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../build/css/styles.css">
    <link rel="stylesheet" href="../build/css/artists.css">
    <script type="module" src="../build/js/profile-menu.js"></script>
    <script defer src="../build/js/language-link.js"></script>
</head>
<body data-prints-page="catalog">
    <div class="prints-page">
        <div class="announcement-bar">
            <div class="container announcement-bar__inner">
                <span>Framing included</span>
                <span>Four sizes available</span>
                <span>Made to order</span>
            </div>
        </div>

        <header class="prints-header">
            <div class="container prints-header__inner">
                <nav class="prints-nav prints-nav--left" aria-label="Main navigation">
                    <a href="./?category=abstract">Abstract</a>
                    <a href="./?category=figurative">Figurative</a>
                    <a href="./?category=landscape">Landscape</a>
                </nav>
                <a class="prints-brand" href="./">MUKASHOV GALLERY</a>
                <div class="prints-nav prints-nav--right">
                    <details class="profile-menu" data-profile-menu>
                        <summary aria-label="Profile" title="Profile">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="8" r="3.25"></circle>
                                <path d="M5 20v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"></path>
                            </svg>
                        </summary>
                        <div class="profile-menu__panel">
                            <div data-profile-guest>
                                <a href="../artists.html?mode=login">Log in</a>
                                <a href="../artists.html?mode=register">Register</a>
                            </div>
                            <div data-profile-account hidden>
                                <a href="../artists.html#works">My artworks</a>
                                <a href="../artists.html#new-work">Add artwork</a>
                                <a href="../artists.html#profile">Profile settings</a>
                                <button type="button" data-profile-signout>Log out</button>
                            </div>
                            <p class="profile-menu__notice" role="status" hidden></p>
                        </div>
                    </details>
                    <button class="nav-action" type="button" data-favourites-open aria-label="Open favourites">
                        <span class="nav-action__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M12 21.35 10.55 20C5.4 15.36 2 12.27 2 8.5 2 5.41 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6.01 6.01 0 0 1 16.5 3C19.58 3 22 5.41 22 8.5c0 3.77-3.4 6.86-8.55 11.54L12 21.35Z"></path>
                            </svg>
                        </span>
                        <span class="nav-action__label">Favourites</span>
                        <span class="nav-action__count" data-favourites-count>0</span>
                    </button>
                    <button class="nav-action" type="button" data-cart-open aria-label="Open cart">
                        <span class="nav-action__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M7 7.5V6a5 5 0 0 1 10 0v1.5"></path>
                                <path d="M5 7.5h14l-1.2 13H6.2L5 7.5Z"></path>
                            </svg>
                        </span>
                        <span class="nav-action__label">Cart</span>
                        <span class="nav-action__count" data-cart-count>0</span>
                    </button>
                </div>
            </div>
        </header>

        <main>
            <section class="filter-waypoint" id="filterWaypoint"></section>

            <section class="catalog" id="catalog">
                <div class="container">
                    <div class="public-artist-heading" id="public-artist-heading" hidden>
                        <h1 id="public-artist-name"></h1>
                        <p id="public-artist-city"></p>
                        <a href="./">Full catalogue</a>
                    </div>
                    <p id="catalog-status" role="status" hidden></p>
                    <div class="prints-grid" id="printsGrid"></div>
                </div>
            </section>
        </main>

        <footer class="prints-footer">
            <div class="container prints-footer__inner">
                <p>© 2026 Mukashov Gallery</p>
                <nav class="prints-footer__links" aria-label="Gallery documents">
                    <a href="./offer.html">Public offer</a>
                    <span aria-hidden="true">·</span>
                    <a href="./privacy.html">Personal data policy</a>
                    <span aria-hidden="true">·</span>
                    <a href="../" hreflang="ru" lang="ru" data-gallery-language>Русский</a>
                </nav>
            </div>
        </footer>
    </div>

    <script src="js/data.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
