<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Смена пароля — Mukashov Gallery</title>
    <link rel="stylesheet" href="build/css/styles.css">
    <link rel="stylesheet" href="build/css/artists.css">
    <script type="module" src="build/js/reset-password.js"></script>
</head>
<body><main class="container artists-page">
    <h1>Новый пароль</h1>
    <p id="reset-status" role="status">Проверяем ссылку из письма…</p>
    <form id="reset-form" class="artist-form" hidden>
        <label>Новый пароль <input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="72" required></label>
        <button class="button button--solid">Сохранить пароль</button>
    </form>
    <a href="./artists.html?mode=login">Перейти ко входу</a>
</main></body></html>
