<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Дополнительная информация о принте и оформлении.">
    <title>Информация — Mukashov Prints</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="build/css/styles.css">
    <link rel="stylesheet" href="build/css/artists.css">
</head>
<body data-prints-page="info">
    <div class="prints-page">
        <div class="announcement-bar">
            <div class="container announcement-bar__inner">
                <span>Оформление в багет включено</span>
                <span>4 размера на запуске</span>
                <span>Сборка под заказ</span>
            </div>
        </div>

        <header class="prints-header">
            <div class="container prints-header__inner">
                <nav class="prints-nav prints-nav--left" aria-label="Основная навигация">
                    <a href="./">Prints</a>
                    <a href="./?category=abstract">Abstract</a>
                    <a href="./?category=figurative">Figurative</a>
                    <a href="./?category=landscape">Landscape</a>
                </nav>
                <a class="prints-brand" href="./">MUKASHOV PRINTS</a>
                <div class="prints-nav prints-nav--right">
                    <a href="./artists.html">Художникам</a>
                    <a class="prints-nav__text-link" href="../">Main Site</a>
                    <button class="nav-action" type="button" data-favourites-open aria-label="Открыть избранное">
                        <span class="nav-action__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M12 21.35 10.55 20C5.4 15.36 2 12.27 2 8.5 2 5.41 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6.01 6.01 0 0 1 16.5 3C19.58 3 22 5.41 22 8.5c0 3.77-3.4 6.86-8.55 11.54L12 21.35Z"></path>
                            </svg>
                        </span>
                        <span class="nav-action__label">Favourites</span>
                        <span class="nav-action__count" data-favourites-count>0</span>
                    </button>
                    <button class="nav-action" type="button" data-cart-open aria-label="Открыть корзину">
                        <span class="nav-action__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" focusable="false">
                                <path d="M7 7.5V6a5 5 0 0 1 10 0v1.5"></path>
                                <path d="M5 7.5h14l-1.2 13H6.2L5 7.5Z"></path>
                            </svg>
                        </span>
                        <span class="nav-action__label">Cart</span>
                        <span class="nav-action__count" data-cart-count>0</span>
                    </button>
                </div>
            </div>
        </header>

        <main class="product-main">
            <div class="container">
                <a class="back-link" id="infoBackLink" href="./">Back</a>

                <section class="info-page-shell">
                    <div class="info-page-shell__media" id="infoPageMedia"></div>
                    <div class="info-page-shell__content" id="infoPageContent"></div>
                </section>
            </div>

            <section class="footer-links-bar" id="infoPageMenu"></section>
        </main>

        <footer class="prints-footer">
            <div class="container prints-footer__inner">
                <p>© 2026 Mukashov Prints</p>
                <a href="./">Открыть весь каталог</a>
            </div>
        </footer>
    </div>

    <script src="build/js/data.js"></script>
    <script src="build/js/scripts.js"></script>
</body>
</html>
